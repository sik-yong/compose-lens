# A small web stack used as the default sample in Compose Lens.
name: shop

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [frontend]
    depends_on:
      - web

  web:
    build:
      context: ./web
      target: production
    environment:
      API_URL: http://api:8000
    networks: [frontend, backend]
    depends_on:
      api:
        condition: service_healthy

  api:
    image: example/shop-api:2.4
    environment:
      DATABASE_URL: postgres://shop:change-me@db:5432/shop
      REDIS_URL: redis://cache:6379
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  migrate:
    image: example/shop-api:2.4
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: example/shop-worker:2.4
    networks: [backend]
    volumes:
      - uploads:/data/uploads
    depends_on: [cache, db]

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: change-me
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]

  cache:
    image: redis:7-alpine
    networks: [backend]

networks:
  frontend:
  backend:

volumes:
  db-data:
  uploads:
