services:
  db: {image: x}
  cache: {image: x}
  migrate: {image: x}
  short:
    image: x
    depends_on: [db, cache]
  long:
    image: x
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_started
        required: false
  broken:
    image: x
    depends_on:
      ghost: {condition: service_started}
      db: {condition: never}
